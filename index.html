<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MainStay-x</title>
  <meta name="description" content="MainStay-x reúne, fortalece e acelera os negócios do grupo.">
  <meta name="theme-color" content="#05070D">
  <link rel="icon" href="assets/logo/mainstay-x-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..600&display=swap">
  <link rel="stylesheet" href="assets/fonts/mainstay-sans.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="MainStay-x, início">
      <img src="assets/logo/mainstay-x-logo-dark.svg" alt="MainStay-x" width="200" height="32">
    </a>
    <nav class="nav-links">
      <a class="nav-link" href="/gmsync/">GMSync</a>
      <!-- Troque pelo link de convite do grupo de WhatsApp -->
      <a class="nav-link nav-ext" href="https://chat.whatsapp.com/SEU-CONVITE" target="_blank" rel="noopener">Construindo Sonhos <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main class="hero" id="hero">
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <div class="glow" aria-hidden="true"></div>
    <svg class="mark" id="mark" viewBox="-60 -60 1040 820" aria-hidden="true">
      <polyline points="40,700 40,0 320,350 600,0 880,700" />
      <line x1="880" y1="0" x2="600" y2="700" class="mark-accent" />
    </svg>

    <div class="hero-inner" id="tilt">
      <p class="eyebrow reveal"><span class="pulse"></span>Grupo MainStay-x</p>
      <h1 class="reveal">A estrutura por trás<br><span class="grad">do que vem a seguir.</span></h1>
      <p class="lead reveal">Reunimos, fortalecemos e aceleramos os negócios do grupo. Uma só base para empresas que constroem o futuro.</p>
      <div class="cta-row reveal">
        <a class="cta" id="cta" href="https://chat.whatsapp.com/SEU-CONVITE" target="_blank" rel="noopener">
          <span class="cta-text"><small>Entre para o grupo seleto</small>Construindo Sonhos</span>
          <span class="cta-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </span>
        </a>
        <span class="cta-note">Grupo exclusivo no WhatsApp</span>
      </div>
    </div>

    <div class="foot">
      <span>© 2026 MainStay-x</span>
      <span class="scroll-cue" aria-hidden="true"><i></i></span>
    </div>
  </main>

  <script src="assets/js/hero.js"></script>
</body>
</html>
